<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6656">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>시니어 프리미엄 투어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한 줄 세로 흐름(웹툰처럼): 고정 머리 → 질문 하나 → 고른 만큼만 아래로 펼침 → 고정 아래 띠(상담·보내기) */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --ink:#14221D; --muted:#3E5149; --line:#C5D3CD;
  --accent:#1E6656; --accent-ink:#FFFFFF; --warm:#A8402B; --warm-ink:#FFFFFF; --chip:#E1ECE8;
  --f-display:"Gowun Batang","Noto Serif KR",Batang,serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fs:19px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211D; --ink:#EBF3EF; --muted:#B9C9C2; --line:#2B3B35;
  --accent:#72C3AE; --accent-ink:#0E1613; --warm:#E8876B; --warm-ink:#1A0E0A; --chip:#1E2C27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --ink:#EBF3EF; --muted:#B9C9C2; --line:#2B3B35;
  --accent:#72C3AE; --accent-ink:#0E1613; --warm:#E8876B; --warm-ink:#1A0E0A; --chip:#1E2C27; color-scheme:dark}
:root.big{--fs:23px}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;padding-inline:16px;padding-block:0 7.5rem}
.wrap{max-width:40rem;margin-inline:auto;display:flex;flex-direction:column;gap:1.4rem}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
button,a.btn{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--warm);outline-offset:3px}

/* 머리 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:.7rem 16px .6rem;border-bottom:1px solid var(--line)}
.top-in{max-width:40rem;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem}
.brand{flex:1 1 12rem;min-width:0}
.brand h1{font-size:1.15rem;color:var(--accent)}
.brand .ed{font-size:.85rem;color:var(--muted);font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:.4rem}
.tool{min-height:2.6rem;padding:.2rem .75rem;border-radius:.6rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.85rem;font-weight:700}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:.8rem;color:var(--muted);text-align:center;padding-top:.8rem}

/* 큰 질문과 큰 단추 */
.ask{display:flex;flex-direction:column;gap:.9rem;padding-top:.6rem}
.big-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.8rem}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;min-height:5.2rem;padding:1rem 1.1rem;border-radius:1rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.pick b{font-family:var(--f-display);font-size:1.3rem}
.pick span{color:var(--muted);font-size:.9rem}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.nights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.night{min-height:3.6rem;border-radius:.8rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.1rem;font-weight:700}
.night[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* 여정 목록 */
.list{display:flex;flex-direction:column;gap:.7rem}
.trip{display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:.2rem .9rem;align-items:center;padding:.9rem 1rem;border-radius:1rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;width:100%}
.trip .mark{grid-row:span 2;width:3.2rem;height:3.2rem;border-radius:.8rem;background:var(--chip);display:grid;place-items:center;font-family:var(--f-display);font-size:1.25rem;color:var(--accent);font-weight:700}
.trip b{font-size:1.1rem}
.trip span{color:var(--muted);font-size:.9rem}
.trip[aria-pressed="true"]{border-color:var(--accent);border-width:2px}

/* 여정 상세 */
.sheet{background:var(--surface);border:1.5px solid var(--line);border-radius:1.1rem;padding:1.2rem 1.1rem;display:flex;flex-direction:column;gap:1.1rem}
.sec{display:flex;flex-direction:column;gap:.6rem}
.sec + .sec{border-top:1px solid var(--line);padding-top:1rem}
.lead{color:var(--muted)}
.days{display:flex;flex-direction:column;gap:.55rem;margin:0;padding:0;list-style:none}
.days li{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.6rem}
.days .d{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.3rem 1rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{background:var(--chip);color:var(--ink);border-radius:999px;padding:.15rem .7rem;font-size:.85rem;font-weight:500}
.verify{display:inline-flex;align-items:center;gap:.35rem;color:var(--accent);font-weight:700;font-size:.9rem}
.rows{display:flex;flex-direction:column;gap:.6rem}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem .8rem;padding:.8rem .9rem;border-radius:.9rem;background:var(--chip)}
.row .txt{min-width:0;flex:1 1 12rem}
.row .txt b{display:block}
.row .txt span{color:var(--muted);font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;padding:.3rem 1.1rem;border-radius:.75rem;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.hint{font-size:.85rem;color:var(--muted)}

/* 여행 경비 */
.opt{display:flex;flex-direction:column;gap:.35rem}
.olbl{font-weight:700;color:var(--muted);font-size:.9rem}
.seg{min-height:2.8rem;padding:.2rem .9rem;border-radius:.7rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bill{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:.9rem;overflow:hidden}
.bl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.4rem .7rem;align-items:center;padding:.7rem .8rem;border-bottom:1px solid var(--line)}
.bt{min-width:0} .bt b{display:block} .bt span{color:var(--muted);font-size:.85rem}
.ba{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bx{min-height:2.4rem;padding:0 .6rem;border-radius:.6rem;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font-size:.85rem;font-weight:700}
.btot,.bper{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;padding:.7rem .8rem;font-variant-numeric:tabular-nums}
.btot{background:var(--chip)} .btot b{font-size:1.35rem;color:var(--accent)} .btot span{font-weight:700}
.bper{color:var(--muted);font-weight:700}
@media (max-width:26rem){.bl{grid-template-columns:minmax(0,1fr) auto}.bl .bx{grid-column:2;justify-self:end}}
/* 이달의 여정 · 해외편 */
.month{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.7rem}
.mcard{display:flex;flex-direction:column;gap:.2rem;padding:1rem;border-radius:1rem;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);text-align:left}
.mcard .tag{font-size:.8rem;font-weight:700;color:var(--warm);letter-spacing:.04em}
.mcard b{font-family:var(--f-display);font-size:1.15rem}
.mcard span{color:var(--muted);font-size:.9rem}
.abroad{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem}
.soon{padding:.8rem .9rem;border-radius:.9rem;border:1.5px dashed var(--line);color:var(--muted)}
.soon b{display:block;color:var(--ink)}

/* 아래 띠 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:.6rem 16px calc(.6rem + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:40rem;margin-inline:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.bar button{min-height:3.4rem;border-radius:.8rem;border:0;font-weight:700;font-size:.95rem;line-height:1.25}
.b-call{background:var(--warm);color:var(--warm-ink)}
.b-send{background:var(--accent);color:var(--accent-ink)}
.b-home{background:var(--chip);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:6.2rem;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:.8rem;font-size:.95rem;z-index:7}
.panel{background:var(--chip);border-radius:.9rem;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.5rem}
.panel .num{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;user-select:all}
@media (prefers-reduced-motion:no-preference){.sheet,.list,.nights{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1 id="appTitle"></h1><div class="ed" id="edition"></div></div>
    <div class="tools">
      <button class="tool" id="bigBtn" aria-pressed="false"></button>
      <button class="tool" id="readBtn"></button>
      <button class="tool" id="langBtn"></button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="bar"><div class="bar-in">
  <button class="b-call" id="callBtn"></button>
  <button class="b-send" id="sendBtn"></button>
  <button class="b-home" id="homeBtn"></button>
</div></div>

const t = (k, a) => { const v = T[k][L]; return typeof v === "function" ? v(a) : v; };
const pick = o => (typeof o === "object" && o !== null && "ko" in o) ? (L ? o.en : o.ko) : o;

function transRows(x, taxiSub){

  if (x.air) h += multiRow("✈ " + t("air"), esc(pick(x.air)), AIR) + multiRow("✈ " + t("lcc"), t("lccSub"), LCC);

}

function curRent(x){ const h = curHow(x); return S.rent === null ? (h === "air" || h === "lcc") : S.rent; }
function costItems(x, month){
  const p = x.price || {}, n = S.people, how = curHow(x), rent = curRent(x), out = [];
  const days = month ? 30 : x.n + 1, nights = month ? 30 : x.n;
  const tn = {train: (x.line ? pick(x.line) : t("hTrain")), air: t("hAir"), lcc: t("hLcc")};
  if (how === "car") out.push({k:"fuel", lab:t("cFuel"), det:(L ? "Round trip by car" : "자가용 왕복"), amt:p.car});
  else { const one = how === "train" ? p.fare : (how === "air" ? p.air : p.lcc);
         out.push({k:"trans", lab:t("cTrans"), det:tn[how] + (L ? " round trip × " : " 왕복 × ") + t("ppl", n), amt:one * 2 * n}); }
  const rooms = n > 2 ? 2 : 1;
  out.push({k:"stay", lab:t("cStay"),
            det: month ? pick(x.home).replace(/\s*\((예시|sample)\)/, "") + (L ? " · 1 month" : " · 한 달")
                       : pick(x.hotel).replace(/\s*\((예시|sample)\)/, "") + " · " + nights + (L ? " nights" : "박") + (rooms > 1 ? (L ? " · 2 rooms" : " · 객실 2개") : ""),
            amt: month ? p.rate : p.hotel * nights * rooms});
  if (rent && how !== "car") out.push({k:"rent", lab:t("cRent"), det:(L ? "Lotte / SK · " : "롯데·SK · ") + (month ? (L ? "1 month" : "한 달") : days + (L ? " days" : "일")), amt: month ? RENT_M : RENT_D * days});
  if (!rent || how === "car") { const c = month ? 8 : x.n * 2 + 2; out.push({k:"taxi", lab:t("cTaxi"), det:(L ? "About " + c + " rides" : "약 " + c + "회"), amt:TAXI * c}); }
  out.push({k:"meal", lab:t("cMeal"), det:t("ppl", n) + " × " + (month ? (L ? "1 month" : "한 달") : days + (L ? " days" : "일")), amt: month ? MEAL_M * n : MEAL * n * days});
  if (!month && p.tix) out.push({k:"tix", lab:t("cTix"), det:t("ppl", n), amt:p.tix * n});
  return out;
}
function perHead(tot){ return Math.round(tot / S.people / 100) * 100; }
function costBox(x, month){
  const items = costItems(x, month), on = items.filter(i => !S.off[i.k]), offs = items.filter(i => S.off[i.k]);
  const tot = on.reduce((a, i) => a + i.amt, 0), hs = hows(x), how = curHow(x), rent = curRent(x);
  const HL = {train:t("hTrain"), air:t("hAir"), lcc:t("hLcc"), car:t("hCar")};
  let h = '<div class="sec" id="costSec"><h3>💰 ' + t("cost") + '</h3><p class="hint">' + t("costSub") + '</p>';
  h += '<div class="opt"><span class="olbl">' + t("people") + '</span><div class="chips">' + [1,2,3,4].map(k => '<button class="seg" data-ppl="' + k + '" aria-pressed="' + (S.people===k) + '">' + t("ppl", k) + '</button>').join("") + '</div></div>';
  h += '<div class="opt"><span class="olbl">' + t("how") + '</span><div class="chips">' + hs.map(k => '<button class="seg" data-how="' + k + '" aria-pressed="' + (how===k) + '">' + HL[k] + '</button>').join("")
     + (how !== "car" ? '<button class="seg" data-rent="1" aria-pressed="' + rent + '">' + (rent ? t("rentOn") : t("rentOff")) + '</button>' : '') + '</div></div>';
  h += '<div class="bill">' + on.map(i => '<div class="bl"><div class="bt"><b>' + i.lab + '</b><span>' + esc(i.det) + '</span></div><span class="ba">' + t("won", i.amt) + '</span><button class="bx" data-off="' + i.k + '">' + t("remove") + '</button></div>').join("")
     + '<div class="btot"><span>' + t("total") + '</span><b>' + t("won", tot) + '</b></div><div class="bper"><span>' + t("per") + '</span><span>' + t("won", perHead(tot)) + '</span></div></div>';
  if (offs.length) h += '<div class="chips">' + offs.map(i => '<button class="seg" data-on="' + i.k + '">＋ ' + i.lab + ' ' + t("back") + '</button>').join("") + '</div>';
  return h + '<p class="hint">' + t("estimate") + '</p></div>';
}
function costText(x, month){
  const on = costItems(x, month).filter(i => !S.off[i.k]), tot = on.reduce((a, i) => a + i.amt, 0);
  return "───────────\n" + on.map(i => i.lab + "  " + i.det + "  " + t("won", i.amt)).join("\n")
    + "\n───────────\n" + t("total") + " " + t("won", tot) + " (" + t("per") + " " + t("won", perHead(tot)) + ")\n" + t("estimate");
}
function tripSheet(x){
  let h = '<article class="sheet" id="sheet"><div class="sec"><h2>' + esc(pick(x.name)) + '</h2><p class="lead">' + esc(pick(x.sub)) + ' · ' + t("nightLbl", x.n) + '</p></div>';
  if (x.id === "gj") h += '<div class="sec"><a class="btn" style="min-height:3.6rem;font-size:1.05rem" href="https://emhwang3-boop.github.io/tour/drive.html?trip=gj" target="_blank" rel="noopener">' + t("drive") + '</a><span class="hint">' + t("driveSub") + '</span></div>';
  h += '<div class="sec"><h3>' + t("sched") + '</h3><ol class="days">'
     + x.days.map((d, i) => '<li><span class="d">' + (L ? "Day " + (i+1) : (i+1) + "일차") + '</span><span>' + esc(pick(d)) + '</span></li>').join("") + '</ol></div>';
  h += '<div class="sec"><h3>' + t("stay") + '</h3><b>' + esc(pick(x.hotel)) + '</b>'
     + '<span class="verify">' + t("verified") + '</span><span class="hint">' + t("verifyRule") + '</span>'
     + '<dl class="kv"><dt>' + t("grade") + '</dt><dd>' + stars(x.grade) + '</dd>'
     + '<dt>' + t("review") + '</dt><dd>' + x.score.toFixed(1) + ' / 5 · ' + x.cnt.toLocaleString() + (L ? " reviews" : "건") + '</dd>'
     + '<dt>' + t("inT") + '</dt><dd>' + x.inT + '</dd><dt>' + t("outT") + '</dt><dd>' + x.outT + '</dd></dl>'
     + '<div class="chips">' + x.chips.map(c => '<span class="chip">' + esc(pick(c)) + '</span>').join("") + (x.pickup ? '<span class="chip">' + t("pickup") + '</span>' : '') + '</div></div>';
  h += '<div class="sec"><h3>' + t("trans") + '</h3><div class="rows">' + transRows(x, esc(pick(x.taxi))) + '</div></div>';
  h += costBox(x, false);
  h += '<div class="sec"><h3>' + t("care") + '</h3><dl class="kv"><dt>' + t("hosp") + '</dt><dd>' + esc(pick(x.hosp)) + '</dd></dl></div>';
  return h + '</article>';
}

function staySheet(x){
  let h = '<article class="sheet" id="sheet"><div class="sec"><h2>' + esc(pick(x.name)) + ' · ' + t("month") + '</h2><p class="lead">' + esc(pick(x.sub)) + '</p></div>';
  h += '<div class="sec"><h3>' + t("monthHome") + '</h3><b>' + esc(pick(x.home)) + '</b><dl class="kv"><dt>' + t("rate") + '</dt><dd>' + esc(pick(x.rate)) + '</dd></dl></div>';
  h += '<div class="sec"><h3>' + t("life") + '</h3><div class="chips">' + x.life.map(c => '<span class="chip">' + esc(pick(c)) + '</span>').join("") + '</div></div>';
  h += '<div class="sec"><h3>' + t("dayTrip") + '</h3><ol class="days">' + x.trips.map((d, i) => '<li><span class="d">' + (i+1) + '</span><span>' + esc(pick(d)) + '</span></li>').join("") + '</ol></div>';
  h += '<div class="sec"><h3>' + t("trans") + '</h3><div class="rows">' + transRows(x, L ? "Kakao T taxi" : "카카오T 택시") + '</div></div>';
  h += costBox(x, true);
  return h + '</article>';
}

/* ── 알림 · 패널 ── */
let toastT = null;
function toast(msg){ let el = document.querySelector(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200); }
function panel(html){ const s = $("panelSlot"); if (s) { s.innerHTML = '<div class="panel">' + html + '</div>'; s.scrollIntoView({behavior:"smooth", block:"center"}); } }

function shareText(){
  const tr = S.mode === "short" && TRIPS.find(x => x.id === S.trip);
  const st = S.mode === "month" && STAYS.find(x => x.id === S.stay);
  if (tr) return "[" + t("title") + "] " + pick(tr.name) + " · " + t("nightLbl", tr.n) + " · " + t("ppl", S.people) + "\n"
    + tr.days.map((d, i) => (L ? "Day " + (i+1) : (i+1) + "일차") + ": " + pick(d)).join("\n")
    + "\n" + t("stay") + ": " + pick(tr.hotel) + " (" + t("inT") + " " + tr.inT + " / " + t("outT") + " " + tr.outT + ")"
    + (tr.train ? "\n" + t("train") + ": " + pick(tr.train) : "") + "\n" + costText(tr, false);
  if (st) return "[" + t("title") + "] " + pick(st.name) + " · " + t("month") + "\n" + t("monthHome") + ": " + pick(st.home) + " · " + pick(st.rate)
    + "\n" + t("dayTrip") + ": " + st.trips.map(pick).join(", ") + "\n" + costText(st, true);
  return "";
}

/* ── 읽어 주기 ── */
let speaking = false;
function readAloud(){
  try {
    if (!("speechSynthesis" in window)) return;
    if (speaking) { speechSynthesis.cancel(); speaking = false; render(); return; }
    const txt = ($("sheet") || $("app")).innerText.replace(/[▶✔★🧳🏡🚄🚗🚕]/g, " ");
    const u = new SpeechSynthesisUtterance(txt); u.lang = L ? "en-US" : "ko-KR"; u.rate = 0.9;
    u.onend = () => { speaking = false; $("readBtn").textContent = t("read"); };
    speechSynthesis.speak(u); speaking = true; $("readBtn").textContent = t("stop");
  } catch (e) {}
}

/* ── 누르기 ── */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.mode) { S.mode = b.dataset.mode; S.trip = null; S.stay = null; render(); goTo(S.mode === "short" ? "secNights" : "secStays"); return; }
  if (b.dataset.n) { S.nights = +b.dataset.n; S.trip = null; render(); goTo("secTrips"); return; }
  if (b.dataset.trip) { S.trip = b.dataset.trip; S.how = null; S.rent = null; S.off = {}; render(); goTo("sheet"); return; }
  if (b.dataset.stay) { S.stay = b.dataset.stay; S.how = null; S.rent = null; S.off = {}; render(); goTo("sheet"); return; }
  if (b.dataset.goTrip) { const tr = TRIPS.find(x => x.id === b.dataset.goTrip); S.mode = "short"; S.nights = tr.n; S.trip = tr.id; render(); goTo("sheet"); return; }
  if (b.dataset.goStay) { S.mode = "month"; S.stay = b.dataset.goStay; render(); goTo("sheet"); return; }
  if (b.dataset.ppl) { S.people = +b.dataset.ppl; render(); goTo("costSec"); return; }
  if (b.dataset.how) { S.how = b.dataset.how; S.rent = null; render(); goTo("costSec"); return; }
  if (b.dataset.rent) { const x = (S.mode === "short" ? TRIPS.find(y => y.id === S.trip) : STAYS.find(y => y.id === S.stay)); if (x) S.rent = !curRent(x); render(); goTo("costSec"); return; }
  if (b.dataset.off) { S.off[b.dataset.off] = 1; render(); goTo("costSec"); return; }
  if (b.dataset.on) { delete S.off[b.dataset.on]; render(); goTo("costSec"); return; }
  if (b.dataset.later !== undefined) { toast(t("linkLater")); return; }
  if (b.id === "langBtn") { L = 1 - L; try { localStorage.setItem("spt_lang", L); } catch (_) {} render(); return; }
  if (b.id === "bigBtn") { const on = document.documentElement.classList.toggle("big"); b.setAttribute("aria-pressed", on); try { localStorage.setItem("spt_big", on ? "1" : ""); } catch (_) {} render(); return; }
  if (b.id === "readBtn") { readAloud(); return; }
  if (b.id === "homeBtn") { S.mode = null; S.nights = null; S.trip = null; S.stay = null; render(); window.scrollTo({top:0, behavior:"smooth"}); return; }
  if (b.id === "callBtn") { panel('<b>' + t("callPanel") + '</b><span class="num">1588-0000</span><span class="hint">' + t("callHint") + ' (' + (L ? "sample number" : "예시 번호") + ')</span>'); return; }
  if (b.id === "sendBtn") {
    const txt = shareText(); if (!txt) { toast(t("nothing")); return; }
    const fallback = () => { panel('<b>' + t("copyFail") + '</b><pre style="white-space:pre-wrap;margin:0;user-select:all;font:inherit">' + esc(txt) + '</pre>'); };
    try { navigator.clipboard.writeText(txt).then(() => toast(t("copied")), fallback); } catch (_) { fallback(); }
  }
});
function goTo(id){ requestAnimationFrame(() => { const el = $(id); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); }); }

try { L = +(localStorage.getItem("spt_lang") || 0) === 1 ? 1 : 0; if (localStorage.getItem("spt_big")) { document.documentElement.classList.add("big"); $("bigBtn").setAttribute("aria-pressed","true"); } } catch (_) {}
render();
</script>
