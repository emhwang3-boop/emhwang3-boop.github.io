function buildSteps(di){
  const S = C.days[di], steps = [];

    let len = 0; for (let k = 1; k < pts.length; k++) len += meters(pts[k-1], pts[k]);

    steps.push({stop:i, lat:S[i][0].lat, lon:S[i][0].lon, pan: bearing(pts[0], pts[Math.min(3, pts.length - 1)])});

  const pos = new kakao.maps.LatLng(st.lat, st.lon);
  carOv.setPosition(pos);
  el("prog").style.width = (i / Math.max(1, steps.length - 1) * 100) + "%";
  if (st.stop !== undefined) showStop(st.stop);
  rvc.getNearestPanoId(pos, st.stop !== undefined ? 120 : 60, function(pid){
    if (pid && pid !== lastPano){ lastPano = pid; wantPan = st.pan; rv.setPanoId(pid, pos); misses = 0; note(""); }
    else if (!pid){ misses++; if (misses > 4) note("이 구간은 도로 사진이 없어 지도만 따라갑니다"); }
    if (then) then();
  });
}

function tick(){
  if (!playing) return;
  if (idx >= steps.length - 1){ playing = false;
    el("play").textContent = dayIdx < C.days.length - 1 ? "▶ " + (dayIdx + 2) + "일차로" : "▶ 다시 보기"; return; }
  idx++;
  const st = steps[idx];
  goStep(idx, function(){ timer = setTimeout(tick, st.stop !== undefined ? 4000 : (slow ? 1800 : 900)); });
}

function loadDay(di){
  dayIdx = di; playing = false; clearTimeout(timer); idx = 0; lastPano = null; misses = 0; note("");
  steps = buildSteps(di);
  document.querySelectorAll(".dayb").forEach((b, k) => b.setAttribute("aria-pressed", k === di));
  el("day").textContent = (di + 1) + "일차"; el("play").textContent = "▶ 출발";
  const path = [], legs = (ROUTES[TRIP] && ROUTES[TRIP][di]) || [];
  legs.forEach(l => l.forEach(q => path.push(new kakao.maps.LatLng(q[1], q[0]))));
  if (line) line.setMap(null);
  line = new kakao.maps.Polyline({ map, path, strokeWeight:5, strokeColor:"#1E6656", strokeOpacity:.9 });
  const bounds = new kakao.maps.LatLngBounds(); path.forEach(p => bounds.extend(p)); if (path.length) map.setBounds(bounds, 12, 12, 12, 12);
  goStep(0);
}

kakao.maps.load(function(){
  map = new kakao.maps.Map(el("mini"), { center:new kakao.maps.LatLng(35.82, 129.24), level:8, draggable:true });
  rv = new kakao.maps.Roadview(el("rv")); rvc = new kakao.maps.RoadviewClient();
  /* 사진이 바뀔 때마다 달리는 방향을 바라보게 */
  const look = () => rv.setViewpoint({ pan:wantPan, tilt:0, zoom:0 });
  kakao.maps.event.addListener(rv, "init", look);
  kakao.maps.event.addListener(rv, "panoid_changed", look);
  const car = document.createElement("div"); car.className = "car"; car.textContent = "🚗";
  carOv = new kakao.maps.CustomOverlay({ map, content:car, position:new kakao.maps.LatLng(35.7983, 129.1386), yAnchor:.6, zIndex:3 });
  el("days").innerHTML = C.days.map((d, i) => '<button class="dayb" data-d="' + i + '">' + (i + 1) + '일차</button>').join("");
  loadDay(0);
});

document.addEventListener("click", function(e){ const b = e.target.closest(".dayb"); if (b) loadDay(+b.dataset.d); });
el("play").onclick = function(){
  if (!rv) return;
  if (idx >= steps.length - 1){ loadDay(dayIdx < C.days.length - 1 ? dayIdx + 1 : dayIdx); return; }
  playing = !playing; this.textContent = playing ? "⏸ 멈춤" : "▶ 계속";
  if (playing) tick(); else clearTimeout(timer);
};
el("next").onclick = function(){   /* 다음 들르는 곳으로 건너뛰기 */
  if (!rv) return; let j = idx + 1; while (j < steps.length - 1 && steps[j].stop === undefined) j++;
  clearTimeout(timer); idx = j; goStep(idx, function(){ if (playing) timer = setTimeout(tick, 4000); });
};
el("speed").onclick = function(){ slow = !slow; this.textContent = slow ? "속도: 느리게" : "속도: 보통"; };
</script>
</body>
</html>
