<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>큐빅 꼬치 타워</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: transparent; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
  #panel { position: absolute; top: calc(env(safe-area-inset-top,0px) + 8px); left: 0; right: 0; text-align: center; z-index: 5; pointer-events: none; padding: 0 16px; }
  #panel .disc { font-size: 10px; color: #b3bdc9; line-height: 1.35; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  #panel .ic { color: #7fd8ff; font-weight: 800; }
  /* 단추는 오른쪽 세로 한 줄, AR 전용은 왼쪽 세로 줄 — 탑 아래를 안 가리게 (사장님 2026-09-22) */
  #controls, #controlsL { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 5; }
  #controls { right: 10px; align-items: flex-end; }
  #controlsL { left: 10px; align-items: flex-start; }
  button { background: rgba(0,255,204,0.9); color: #04120f; border: none; padding: 7px 11px; border-radius: 15px; font-weight: 700; font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.45); white-space: nowrap; }
  button.ghost { background: rgba(42,50,62,0.9); color: #fff; }
  #tstate { display: none; }
</style>
</head>
<body>
<div id="arHint" style="display:none;position:absolute;top:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px;white-space:nowrap">바닥이나 책상을 천천히 비추세요</div>
<div id="controls">
  <button id="btn-play">시간 경과</button>
  <button id="btn-gyro" class="ghost">📱 기울여 보기</button>
  <div id="tstate">지금 상태</div>
  <button id="btn-reset" class="ghost">처음</button>
  <button id="btn-ar" class="ghost" style="display:none">AR로 보기</button>
</div>
<div id="controlsL">
  <button id="btn-arp" class="ghost" style="display:none">크게</button>
  <button id="btn-arm" class="ghost" style="display:none">작게</button>
  <button id="btn-arf" style="display:none">앞에 세우기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ── 데이터: URL 해시(#items=base64)에서 읽는다. 없으면 예시. ──
  let RAW = [
    { name: "정기예금", base: 4000, ret:  0.01, vol: 0.2 },
    { name: "삼성전자", base: 3000, ret:  0.05, vol: 0.8 },
    { name: "KB금융",   base: 2200, ret: -0.06, vol: 1.1 },
    { name: "현대차",   base: 2500, ret:  0.12, vol: 1.6 },
    { name: "NAVER",    base: 1800, ret: -0.15, vol: 2.3 },
    { name: "에코프로", base: 1200, ret:  0.45, vol: 3.6 }
  ];
  try {
    const p = new URLSearchParams((location.hash || "").slice(1));
    const d = p.get("items");
    if (d) {
      const arr = JSON.parse(decodeURIComponent(escape(atob(d))));
      if (arr && arr.length) {
        RAW = arr.map(function (x) { return { name: String(x.n || x.name || "?"), base: +(x.b || x.base || 100) || 100, ret: +(x.r || x.ret || 0) || 0, vol: Math.max(0.05, +(x.v || x.vol || 1) || 1), k: +(x.k || 0) || 0 }; });
        var _st = document.getElementById("subt"); if (_st) _st.textContent = p.get("t") ? decodeURIComponent(p.get("t")) : ("담긴 " + RAW.length + "종목");
      }
    }
  } catch (e) {}

  const items = RAW.slice().sort(function (a, b) { return ((a.k || 0) - (b.k || 0)) || (a.vol - b.vol); });

  // ── 앱에서 고른 모양·목표·손절 (2026-09-23) — 화면에 바꾸는 단추는 없다 ──
  let SHAPE = "tower", GOAL = 0.25, STOP = -0.10;
  try {
    const q = new URLSearchParams((location.hash || "").slice(1));
    if (q.get("shape") === "tree") SHAPE = "tree";
    const g = parseFloat(q.get("goal")), st = parseFloat(q.get("stop"));
    if (isFinite(g)) GOAL = g;
    if (isFinite(st)) STOP = st;
  } catch (e) {}
  const CLS_N = items.reduce(function (m, it) { return Math.max(m, (it.k || 0) + 1); }, 1);
  function ptRet() {                                  // 포트폴리오 수익률 — 균등 비중
    if (!items.length) return 0;
    return items.reduce(function (a, it) { return a + it.cur; }, 0) / items.length;
  }   // 아래 = 안전한 자산군(k 작음), 같은 자산군 안에서만 변동성 낮은 것이 아래
  const volMax = Math.max.apply(null, items.map(function (x) { return x.vol; })) || 1;
  const RAMP = [0x2dd4bf, 0x6ee06a, 0xf2d024, 0xf59a2e, 0xf0562e, 0xcf1a3a];

  const scene = new THREE.Scene();
  scene.background = null;
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dir = new THREE.DirectionalLight(0xffffff, 0.85); dir.position.set(60, 240, 120); scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0x88aaff, 0.25); dir2.position.set(-80, 40, -60); scene.add(dir2);

  const GROUND_Y = -18;   // 바닥 바둑판은 뺐다(사장님 2026-09-22). 실의 아랫점만 이 높이.

  const arRoot = new THREE.Group(); scene.add(arRoot);
  const towerGroup = new THREE.Group(); arRoot.add(towerGroup);
  // 중심축 = 큐브 중심을 정확히 꿰는 가는 실(1px). 탑 높이만큼만, 흔들림을 따라 휜다.
  const THREAD_N = 64;
  const threadGeo = new THREE.BufferGeometry();
  threadGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(THREAD_N * 3), 3));
  const thread = new THREE.Line(threadGeo, new THREE.LineBasicMaterial({ color: 0xb8c0cc, transparent: true, opacity: 0.85 }));
  thread.renderOrder = 0; towerGroup.add(thread);
  // 트리형 — 가지(가는 선)와 달성 고리
  const branchGeo = new THREE.BufferGeometry();
  branchGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(items.length * 2 * 3 + 64 * 3), 3));
  const branches = new THREE.LineSegments(branchGeo, new THREE.LineBasicMaterial({ color: 0x9aa4b2, transparent: true, opacity: 0.8 }));
  branches.visible = false; towerGroup.add(branches);
  let ring = null, ringMode = "", ringTick = 0;
  const barMat = new THREE.MeshStandardMaterial({ color: 0x0a0d14, roughness: 0.6, metalness: 0.35 });
  const frameG = new THREE.Group(); scene.add(frameG);
  const fTop = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), barMat), fBot = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), barMat), fL = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), barMat), fR = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), barMat);
  frameG.add(fTop, fBot, fL, fR);

  function crackTexture() {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d"); g.lineCap = "round";
    for (let k = 0; k < 18; k++) {
      let x = 26 + Math.random() * 204, y = 26 + Math.random() * 204; const pts = [[x, y]];
      const segs = 4 + (Math.random() * 5 | 0);
      for (let s = 0; s < segs; s++) { x += (Math.random() - 0.5) * 100; y += (Math.random() - 0.5) * 100; pts.push([x, y]); }
      g.strokeStyle = "rgba(0,0,0,0.95)"; g.lineWidth = 4;
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let s = 1; s < pts.length; s++) g.lineTo(pts[s][0], pts[s][1]); g.stroke();
      g.strokeStyle = "rgba(255,255,255,0.95)"; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let s = 1; s < pts.length; s++) g.lineTo(pts[s][0], pts[s][1]); g.stroke();
    }
    return new THREE.CanvasTexture(c);
  }
  const CRACK = crackTexture();
  function softDot(rgb) {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(" + rgb + ",1)"); gr.addColorStop(0.35, "rgba(" + rgb + ",0.7)"); gr.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
  }
  const SPARK = softDot("255,255,255");
  const DUST = softDot("205,180,140");

  const K = 1.3, TW = 9;
  function baseSide(v) { return Math.cbrt(Math.max(v, 1)) * K; }
  const fmtMoney = function (v) { return Math.round(v).toLocaleString() + "만"; };
  const fmtPct = function (r) { return (r >= 0 ? "+" : "") + (r * 100).toFixed(1) + "%"; };

  function drawText(it) {
    const g = it.tctx; g.clearRect(0, 0, 256, 256);
    g.textAlign = "center"; g.textBaseline = "middle";
    function ln(txt, y, size, weight, fill) {
      g.font = weight + " " + size + 'px "Segoe UI", system-ui, sans-serif';
      g.lineWidth = 6; g.strokeStyle = "rgba(0,0,0,0.95)"; g.strokeText(txt, 128, y);
      g.fillStyle = fill; g.fillText(txt, 128, y);
    }
    ln(it.name, 94, 36, "800", "#ffffff");
    ln(fmtMoney(it._val), 128, 30, "700", "#eef3f9");
    ln(fmtPct(it.cur), 162, 40, "800", it.cur > 0.0005 ? "#2bff86" : (it.cur < -0.0005 ? "#ff4d4d" : "#c7ced8"));
    it.ttex.needsUpdate = true;
  }

  items.forEach(function (it, i) {
    it.cur = it.ret; it._origRet = it.ret; it.bust = false;
    it._val = it.base * (1 + it.cur);
    it.color = RAMP[Math.min(i, RAMP.length - 1)];
    it.baseColor = new THREE.Color(it.color);
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mat = new THREE.MeshStandardMaterial({ color: it.color, roughness: 0.3, metalness: 0.1, transparent: true, opacity: 0.5, depthWrite: false });
    const cube = new THREE.Mesh(geo, mat); cube.renderOrder = 1;
    it.edge = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }));
    cube.add(it.edge);
    const crackMat = new THREE.MeshBasicMaterial({ map: CRACK, transparent: true, opacity: 0, depthWrite: false, depthTest: false });
    const crackMesh = new THREE.Mesh(new THREE.BoxGeometry(1.03, 1.03, 1.03), crackMat); crackMesh.renderOrder = 2;
    cube.add(crackMesh); it.crackMat = crackMat;

    it.tcanvas = document.createElement("canvas"); it.tcanvas.width = it.tcanvas.height = 256;
    it.tctx = it.tcanvas.getContext("2d");
    it.ttex = new THREE.CanvasTexture(it.tcanvas);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: it.ttex, transparent: true, depthTest: false, depthWrite: false }));
    spr.scale.set(1, 1, 1); spr.renderOrder = 4; cube.add(spr); it.textSprite = spr;
    drawText(it);

    it.sparks = [];
    for (let s = 0; s < 6; s++) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: SPARK, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
      sp.position.set((Math.random() - 0.5) * 1.35, (Math.random() - 0.5) * 1.35, (Math.random() - 0.5) * 1.35);
      sp.userData.phase = Math.random() * 6.28; sp.scale.set(0.4, 0.4, 0.4); cube.add(sp); it.sparks.push(sp);
    }
    it.dust = [];
    for (let d = 0; d < 14; d++) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: DUST, transparent: true, opacity: 0, depthWrite: false }));
      sp.scale.set(1, 1, 1); sp.userData.vy = 0; sp.userData.live = false; towerGroup.add(sp); it.dust.push(sp);
    }
    towerGroup.add(cube); it.mesh = cube; it.mat = mat;
  });

  function litColor(base, ret) {
    const c = base.clone();
    if (ret >= 0) c.lerp(new THREE.Color(0xffffff), Math.min(ret, 1) * 0.5);
    else c.multiplyScalar(1 + Math.max(ret, -0.7) * 0.75);
    return c;
  }

  let camR = 200, fc = 0, eyeX = 0, eyeY = 0;
  let playing = false, prog = 1;
  document.getElementById("btn-play").addEventListener("click", function () { playing = true; prog = 0; document.getElementById("tstate").innerText = "경과 중…"; });
  document.getElementById("btn-reset").addEventListener("click", function () {
    playing = false; prog = 0;
    items.forEach(function (it) { it.cur = 0; });
    document.getElementById("tstate").innerText = "처음(0%)";
  });

  let gyroOn = false, gyro = null, baseAng = 0.6, leanX = 0;
  function enableGyro() {
    function h(e) { if (e.beta != null || e.gamma != null) gyro = { beta: e.beta || 0, gamma: e.gamma || 0 }; }
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(function (s) { if (s === "granted") { window.addEventListener("deviceorientation", h); gyroOn = true; } }).catch(function () {});
      } else { window.addEventListener("deviceorientation", h); gyroOn = true; }
      var b = document.getElementById("btn-gyro"); if (b) b.textContent = "📱 기울임 켜짐";
    } catch (e) {}
  }
  document.getElementById("btn-gyro").addEventListener("click", enableGyro);

  // ── AR (WebXR) — 안드로이드 크롬. 폰 카메라가 찍는 바닥·책상 위에 탑을 세운다 (사장님 2026-09-22 실측용) ──
  let xrSession = null, xrHitSource = null, arPlaced = false, arOn = false, arHeight = 0.9;   // 탑 높이(m) — 사장님 "너무 작다"(35cm) → 90cm
  const arBtnP = document.getElementById("btn-arp"), arBtnM = document.getElementById("btn-arm"), arBtnF = document.getElementById("btn-arf");
  const _camPos = new THREE.Vector3(), _camDir = new THREE.Vector3();
  let arHits = 0;
  // 바닥을 못 찾아도 폰 앞 0.8m, 눈높이 40cm 아래에 세운다
  arBtnF.addEventListener("click", function () {
    try { const cam = renderer.xr.getCamera(camera); cam.getWorldPosition(_camPos); cam.getWorldDirection(_camDir); _camDir.y = 0; _camDir.normalize();
      arRoot.position.copy(_camPos).addScaledVector(_camDir, 0.8); arRoot.position.y = _camPos.y - 0.4; arPlaced = true; } catch (e) {}
  });
  arBtnP.addEventListener("click", function () { arHeight = Math.min(arHeight * 1.35, 4); });
  arBtnM.addEventListener("click", function () { arHeight = Math.max(arHeight / 1.35, 0.1); });
  const reticle = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x2bd4c0, transparent: true, opacity: 0.9 }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
  const arBtn = document.getElementById("btn-ar");
  try {
    if (navigator.xr && navigator.xr.isSessionSupported)
      navigator.xr.isSessionSupported("immersive-ar").then(function (ok) { if (ok) arBtn.style.display = ""; }).catch(function () {});
  } catch (e) {}
  function arEnd() {
    arOn = false; arPlaced = false; xrHitSource = null; xrSession = null; reticle.visible = false;
    camera.near = 1; camera.far = 3000; camera.updateProjectionMatrix();
    document.getElementById("arHint").style.display = "none";
    renderer.xr.enabled = false; arRoot.position.set(0, 0, 0); arRoot.scale.set(1, 1, 1); arRoot.quaternion.set(0, 0, 0, 1);
    frameG.visible = true; arBtn.textContent = "AR로 보기"; arBtnP.style.display = "none"; arBtnM.style.display = "none"; arBtnF.style.display = "none";
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  arBtn.addEventListener("click", async function () {
    if (xrSession) { try { await xrSession.end(); } catch (e) {} return; }
    try {
      const ses = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["hit-test"], optionalFeatures: ["dom-overlay"], domOverlay: { root: document.body } });
      camera.near = 0.01; camera.far = 50; camera.updateProjectionMatrix();   // AR 은 미터 단위: 1m 안의 탑이 잘리지 않게
      renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType("local");
      await renderer.xr.setSession(ses);
      const viewer = await ses.requestReferenceSpace("viewer");
      xrHitSource = await ses.requestHitTestSource({ space: viewer });
      xrSession = ses; arOn = true; arPlaced = false; frameG.visible = false; arBtn.textContent = "AR 끝";
      document.getElementById("arHint").style.display = ""; arBtnP.style.display = ""; arBtnM.style.display = ""; arBtnF.style.display = "";
      ses.addEventListener("end", arEnd);
      ses.addEventListener("select", function () {   // 화면을 두드리면 그 자리에 세운다 (다시 두드리면 옮긴다)
        arRoot.position.setFromMatrixPosition(reticle.matrix); arPlaced = true;   // 두드린 순간의 바닥 자리로
      });
    } catch (e) { arEnd(); alert("AR을 열 수 없습니다: " + (e && e.message ? e.message : e)); }
  });

  const clock = new THREE.Clock();
  function animate(_ts, frame) {
    const t = clock.getElapsedTime(); fc++;

    if (playing && prog < 1) { prog = Math.min(1, prog + 0.009); items.forEach(function (it) { it.cur = it.ret * prog; }); if (prog >= 1) document.getElementById("tstate").innerText = "지금 상태"; }

    let y = 0, maxR = 0;
    items.forEach(function (it) {
      const side = baseSide(it.base) * (1 + it.cur * 2.2);
      it._side = Math.max(side, 1.5); it._val = it.base * (1 + it.cur); it._loss = Math.max(0, -it.cur);
      it._ang = 0; it._rad = 0;
      if (SHAPE !== "tree") { it._baseY = y + it._side / 2; y += it._side + 3; }
    });
    if (SHAPE === "tree") {                    // ── 트리: 자산군마다 가지 하나 ──
      const byK = {};
      items.forEach(function (it) { (byK[it.k || 0] = byK[it.k || 0] || []).push(it); });
      const ks = Object.keys(byK).map(Number).sort(function (a, b) { return a - b; });
      ks.forEach(function (k, bi) {
        const arr = byK[k], ang = bi * (2 * Math.PI / Math.max(ks.length, 1)) + 0.35;
        const big = arr.reduce(function (m, it) { return Math.max(m, it._side); }, 1);
        const yy = y + big / 2;
        let rad = big * 1.05;
        arr.forEach(function (it) {
          rad += it._side * 0.62;
          it._ang = ang; it._rad = rad; it._baseY = yy;
          rad += it._side * 0.62;
          if (rad > maxR) maxR = rad;
        });
        arr._tip = rad; arr._y = yy; arr._ang = ang;
        y = yy + big / 2 + big * 0.85;
      });
      window._BRANCH = ks.map(function (k) { return byK[k]; });
    }
    const towerTop = Math.max(y, 1);

    // 좌우 흔들림: (a) 중간층 크랙이 심할 때 (b) 맨 꼭대기가 가분수(위 큐브가 아래보다 클 때)
    let midCrack = 0, topHeavy = 0;
    const n = items.length;
    items.forEach(function (it, i) {
      const isMid = n >= 3 ? (i > 0 && i < n - 1) : false;   // 맨 아래·맨 위를 뺀 가운데 층
      if (isMid && it._loss >= 0.05) midCrack += it._loss - 0.05;
    });
    if (n >= 2) { const top = items[n - 1]._side, below = items[n - 2]._side; if (top > below) topHeavy = top / below - 1; }
    const quakeAmp = Math.min(midCrack * 60 + topHeavy * 10, towerTop * 0.16, 2.6);   // 상한: 탑 높이 16%, 그리고 절대 2.6 — 종목이 적어도 화면 밖으로 안 나가게(2026-09-22)
    let quakeX = quakeAmp > 0.2 ? Math.sin(t * (2.6 + midCrack * 6 + topHeavy * 2)) * quakeAmp : 0;
    if (SHAPE === "tree" && ptRet() <= STOP)   // 손절 도달이면 탑 전체가 심하게 흔들린다
      quakeX += Math.sin(t * 12.5) * towerTop * 0.02 + Math.sin(t * 7.1) * towerTop * 0.012;

    if (arOn) {
      if (frame && xrHitSource) {
        const ref = renderer.xr.getReferenceSpace();
        const hits = frame.getHitTestResults(xrHitSource); arHits = hits.length;
        if (hits.length && ref) {
          const pose = hits[0].getPose(ref); reticle.matrix.fromArray(pose.transform.matrix); reticle.visible = !arPlaced;
          if (!arPlaced) { arRoot.position.setFromMatrixPosition(reticle.matrix); arPlaced = true;   // 처음 바닥을 찾으면 바로 세운다
            document.getElementById("arHint").textContent = "화면을 두드리면 그 자리로 옮깁니다"; }
        } else if (!arPlaced) reticle.visible = false;
      }
      const sAR = arHeight / Math.max(towerTop, 1);         // 탑 높이 arHeight m ([크게][작게]로 조절)
      arRoot.scale.set(sAR, sAR, sAR);
      if (fc % 15 === 0) { try { const cam = renderer.xr.getCamera(camera); cam.getWorldPosition(_camPos);
        const dist = arPlaced ? _camPos.distanceTo(arRoot.position) : 0;
        if (arPlaced && dist < 0.15) { arPlaced = false; }   // 카메라 자리에 세워졌으면(0.0m) 다시 바닥을 찾아 세운다
        document.getElementById("arHint").textContent = (arPlaced ? ("탑 거리 " + dist.toFixed(1) + "m · 높이 " + arHeight.toFixed(1) + "m · ") : "탑 아직 안 세움 · ")
          + (arHits ? "바닥 인식됨" : "바닥 못 찾음 — 천천히 비추거나 [앞에 세우기]"); } catch (e) {} }
      arRoot.visible = arPlaced;
      towerGroup.rotation.x = 0; towerGroup.position.z = 0;
    }
    camR += (Math.max(150, Math.min(towerTop * 2.0, 340)) - camR) * 0.05;
    frameG.visible = !arOn;
    if (!arOn) arRoot.visible = true;
    if (!arOn) { leanX += (0.18 - leanX) * 0.06; towerGroup.rotation.x = leanX; towerGroup.position.z = 10; }
    const asp = renderer.domElement.clientWidth / renderer.domElement.clientHeight;
    let SW2, SH2; if (asp >= 1) { SH2 = towerTop * 0.62; SW2 = SH2 * asp; } else { SH2 = Math.max(towerTop * 0.56, 10.5 / asp); SW2 = SH2 * asp; }   // 세로 화면: 종목이 몇이든 탑이 화면 높이를 거의 다 채운다(사장님 2026-09-22). 폭은 최소 9.5 로 큐브가 잘리지 않게
    if (SHAPE === "tree") {                  // 가지가 옆으로 뻗은 만큼 화면을 넓힌다
      const needW = maxR * 1.35;
      if (SW2 < needW) { SW2 = needW; SH2 = SW2 / asp; }
      if (SH2 < towerTop * 0.58) { SH2 = towerTop * 0.58; SW2 = SH2 * asp; }
    }
    const cyc = (asp >= 1) ? towerTop * 0.5 : towerTop * 0.5;   // 단추가 옆으로 갔으니 탑은 가운데 (2026-09-22)
    let ex, ey;
    if (gyroOn && gyro) { ex = THREE.MathUtils.clamp((gyro.gamma || 0) / 32, -1, 1) * SW2 * 1.15; ey = THREE.MathUtils.clamp(((gyro.beta || 0) - 45) / 38, -1, 1) * SH2 * 0.95; }
    else { baseAng += 0.004; ex = Math.sin(baseAng) * SW2 * 0.55; ey = Math.sin(baseAng * 0.6) * SH2 * 0.15; }
    eyeX += (ex - eyeX) * 0.12; eyeY += (ey - eyeY) * 0.12;
    const EZ = camR * 1.15, nr = 1, fr = 3000;
    if (!arOn) {
    camera.projectionMatrix.makePerspective(nr * (-SW2 - eyeX) / EZ, nr * (SW2 - eyeX) / EZ, nr * (SH2 - eyeY) / EZ, nr * (-SH2 - eyeY) / EZ, nr, fr);
    camera.position.set(eyeX, cyc + eyeY, EZ); camera.quaternion.set(0, 0, 0, 1); camera.updateMatrixWorld(); }
    { const fw = SW2, fbot = cyc - SH2, ftop = cyc + SH2, th = Math.max(2, towerTop * 0.025), w = 2 * fw + 2 * th;
      fTop.position.set(0, ftop, 0); fTop.scale.set(w, th, th);
      fBot.position.set(0, fbot, 0); fBot.scale.set(w, th, th);
      fL.position.set(-fw - th / 2, cyc, 0); fL.scale.set(th, 2 * SH2, th);
      fR.position.set(fw + th / 2, cyc, 0); fR.scale.set(th, 2 * SH2, th); }

    items.forEach(function (it) {
      const side = it._side, loss = it._loss, gain = Math.max(0, it.cur);
      it.mesh.scale.set(side, side, side);
      it.textSprite.scale.set(TW / side, TW / side, 1);
      const vr = Math.pow(it.vol / volMax, 1.5);   // 변동성 = 그 큐브의 좌우 흔들림 (사장님 2026-09-22)
      const volX = Math.sin(t * (1.6 + vr * 4) + it.vol) * vr * Math.min(it._side * 0.22, 1.6) + Math.sin(t * 8 + it.vol) * vr * it._side * 0.05;
      // 위아래 = 수익률. 이익 큐브는 제자리에서 **위로만**, 손실 큐브는 **아래로만** 움직인다(사장님 2026-09-22). 손실이 클수록 잦고 크다. 부스러기는 손실 때만
      const bob = Math.abs(Math.sin(t * (2.5 + Math.abs(it.cur) * 9) + it.vol)) + Math.abs(Math.sin(t * 13 + it.vol)) * 0.2;
      const shakeY = gain > 0.002 ? bob * gain * 7 : (loss > 0.002 ? -bob * loss * 11 : 0);
      const swayX = quakeX * (0.35 + it._baseY / towerTop * 0.9) + volX;
      if (SHAPE === "tree") {
        const rr = it._rad, ca = Math.cos(it._ang), sa = Math.sin(it._ang);
        it.mesh.position.set(ca * rr + swayX, it._baseY + shakeY, -sa * rr);
      } else {
        it.mesh.position.set(swayX, it._baseY + shakeY, 0);
      }
      it.mesh.rotation.y += 0.0015 + Math.pow(it.vol / volMax, 1.3) * 0.026;
      it.mesh.rotation.x = loss > 0 ? Math.sin(t * (2.5 + loss * 5)) * loss * 0.32 : 0;
      it.mesh.rotation.z = loss > 0 ? Math.sin(t * (3 + loss * 6) + 1) * loss * 0.26 : 0;
      it.mat.color.copy(litColor(it.baseColor, it.cur));
      it.mat.emissive.copy(litColor(it.baseColor, it.cur));
      it.mat.emissiveIntensity = gain > 0 ? Math.min(gain, 1) * 0.6 * (0.7 + 0.3 * Math.sin(t * 6 + it.vol)) : 0;
      it.edge.material.color.setHex(it.cur > 0.005 ? 0x2bff86 : (it.cur < -0.005 ? 0xff3b3b : 0xffffff));
      it.edge.material.opacity = Math.abs(it.cur) > 0.005 ? 0.95 : 0.55;
      it.crackMat.opacity = loss > 0.002 ? Math.min(0.5 + loss * 3.5, 1) : 0;
      it.sparks.forEach(function (sp) { sp.material.opacity = gain > 0.02 ? Math.min(gain, 1) * (0.35 + 0.65 * Math.abs(Math.sin(t * 5 + sp.userData.phase))) : 0; });
      const half = side / 2, footY = it.mesh.position.y - half;
      it.dust.forEach(function (sp) {
        if (loss > 0.01) {
          if (!sp.userData.live || sp.position.y < footY - side * 1.7) {
            sp.position.set(it.mesh.position.x + (Math.random() - 0.5) * half * 1.6, footY + Math.random() * 2, (Math.random() - 0.5) * half * 1.6);
            sp.userData.vy = -(0.25 + Math.random() * 0.5 + loss); sp.userData.live = true;
          }
          sp.position.y += sp.userData.vy; sp.position.x += (Math.random() - 0.5) * 0.05;
          sp.material.opacity = Math.min(loss * 2.2, 0.9) * (0.5 + Math.random() * 0.5); sp.scale.setScalar(0.8 + Math.random() * 0.9);
        } else { sp.material.opacity = 0; sp.userData.live = false; }
      });
      if (fc % 6 === 0) drawText(it);
    });

    if (SHAPE === "tree") {                  // ── 트리: 줄기 + 가지 + 달성 고리 ──
      branches.visible = true;
      const pos = threadGeo.attributes.position.array;
      for (let k = 0; k < THREAD_N; k++) {   // 줄기 — 땅에서 꼭대기까지 곧게
        const u = k / (THREAD_N - 1);
        pos[k * 3] = quakeX * u * 0.6; pos[k * 3 + 1] = GROUND_Y + (towerTop + 4 - GROUND_Y) * u; pos[k * 3 + 2] = 0;
      }
      threadGeo.attributes.position.needsUpdate = true;
      const bp = branchGeo.attributes.position.array; let bi2 = 0;
      const tips = [];
      (window._BRANCH || []).forEach(function (arr) {
        const ca = Math.cos(arr._ang), sa = Math.sin(arr._ang);
        const last = arr[arr.length - 1], tipR = last._rad + last._side * 0.65;
        bp[bi2++] = 0; bp[bi2++] = arr._y; bp[bi2++] = 0;                          // 줄기에서
        bp[bi2++] = ca * tipR; bp[bi2++] = arr._y; bp[bi2++] = -sa * tipR;         // 가지 끝으로
        tips.push(new THREE.Vector3(ca * tipR, arr._y, -sa * tipR));
      });
      for (let k = bi2; k < bp.length; k++) bp[k] = 0;
      branchGeo.attributes.position.needsUpdate = true;
      // 목표 달성 · 손절 도달 — 가지 끝끼리 굵게 잇는다
      const pr = ptRet(), want = pr >= GOAL ? "goal" : (pr <= STOP ? "stop" : "");
      if (want !== ringMode || (want && ++ringTick % 20 === 0)) {
        if (ring) { towerGroup.remove(ring); ring.geometry.dispose(); ring = null; }
        if (want && tips.length >= 2) {
          const curve = new THREE.CatmullRomCurve3(tips, true, "catmullrom", 0.4);
          const col = want === "goal" ? 0x39ff14 : 0xff1744;
          ring = new THREE.Mesh(new THREE.TubeGeometry(curve, 140, Math.max(0.6, towerTop * 0.012), 8, true),
            new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.95, depthWrite: false }));
          ring.renderOrder = 3; towerGroup.add(ring);
        }
        ringMode = want;
      }
      if (ring) ring.material.opacity = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(t * (ringMode === "stop" ? 6.5 : 3.2)));
    } else { // 실: 땅 → 큐브 중심들 → 꼭대기 조금 위. 큐브 사이는 옆흔들림을 따라 부드럽게 잇는다
      const pos = threadGeo.attributes.position.array;
      const pts = [[0, GROUND_Y]];
      items.forEach(function (it) { pts.push([it.mesh.position.x, it.mesh.position.y]); });
      const last = items[items.length - 1];
      pts.push([last.mesh.position.x + quakeX * 0.25, last.mesh.position.y + last._side * 0.9]);
      for (let k = 0; k < THREAD_N; k++) {
        const u = k / (THREAD_N - 1) * (pts.length - 1), a = Math.min(pts.length - 2, Math.floor(u)), f = u - a;
        pos[k * 3] = pts[a][0] + (pts[a + 1][0] - pts[a][0]) * f;
        pos[k * 3 + 1] = pts[a][1] + (pts[a + 1][1] - pts[a][1]) * f;
        pos[k * 3 + 2] = 0;
      }
      threadGeo.attributes.position.needsUpdate = true;
    }
    renderer.render(scene, camera);
  }
  renderer.setAnimationLoop(animate);

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
